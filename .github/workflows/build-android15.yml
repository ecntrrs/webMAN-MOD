name: Build ps3netsrv Android 15 APK (Signed)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install NDK 21
        run: sdkmanager "ndk;21.4.7075529"

      - name: Generate keystore
        run: |
          keytool -genkeypair -v \
          -keystore release.keystore \
          -storepass android \
          -keypass android \
          -alias ps3netsrv \
          -keyalg RSA \
          -keysize 2048 \
          -validity 10000 \
          -dname "CN=ps3netsrv,O=Android,C=CL"

      - name: Extract Android source
        run: |
          cd _Projects_/ps3netsrv/bins/Android
          unzip ps3netsrv-android-src_0.5alpha.zip
          echo "=== BUSCANDO GRADLEW ==="
          find . -name gradlew

      - name: Build signed APK
        env:
          ANDROID_KEYSTORE: release.keystore
          STORE_PASSWORD: android
          KEY_ALIAS: ps3netsrv
          KEY_PASSWORD: android
        run: |
          cd _Projects_/ps3netsrv/bins/Android
          DIR=$(find . -name gradlew -exec dirname {} \; | head -n 1)
          echo "Usando proyecto en: $DIR"
          cd "$DIR"
          chmod +x gradlew
          ./gradlew assembleRelease

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ps3netsrv-android15-signed
          path: "**/app/build/outputs/apk/release/*.apk"
